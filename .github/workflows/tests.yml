name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - laravel: '10.*'
            php: '8.4'
          - laravel: '10.*'
            php: '8.5'
          - laravel: '11.*'
            php: '8.1'
          - laravel: '11.*'
            php: '8.5'
          - laravel: '12.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.2'
          # The lowest dependency versions predate PHP 8.5.
          - php: '8.5'
            stability: prefer-lowest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Security blocking would skip every Laravel 10 and 11 release (and the
      # lowest 12 and 13 releases), so the matrix would no longer test the
      # versions composer.json claims to support. Stable only, so a blocked
      # range fails instead of silently resolving to a dev branch.
      - name: Install dependencies
        run: |
          composer config minimum-stability stable
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-security-blocking

      - name: Run tests
        run: vendor/bin/phpunit --testdox --testdox-text testdox.txt

      - name: Add test results to the run summary
        if: ${{ !cancelled() && hashFiles('testdox.txt') != '' }}
        run: |
          tests=$(grep -c '^ \[' testdox.txt || true)
          {
            echo "<details><summary>PHPUnit: ${tests} tests</summary>"
            echo
            echo '```'
            cat testdox.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
